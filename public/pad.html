<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2B2D42">
<title>미로 조작기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#F4F1EA; --ink:#2B2D42; --muted:#8A8C9E; --c:#2B2D42; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html, body { margin:0; height:100%; overflow:hidden; overscroll-behavior:none; background:var(--bg); color:var(--ink);
    font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  .screen { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px; }
  .screen.on { display:flex; }

  /* 방향 선택 */
  #choose h1 { font-size:24px; margin:0 0 6px; text-align:center; }
  #choose p { margin:0 0 28px; color:var(--muted); font-size:15px; text-align:center; }
  .cross { display:grid; grid-template-columns:repeat(3, min(26vw,120px)); grid-template-rows:repeat(3, min(26vw,120px)); gap:12px; }
  .pick { border:0; border-radius:22px; font:inherit; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:15px; font-weight:700; cursor:pointer; box-shadow:0 6px 0 rgba(0,0,0,.15); transition:transform .1s; }
  .pick:active { transform:translateY(3px); box-shadow:0 3px 0 rgba(0,0,0,.15); }
  .pick .ar { font-size:40px; line-height:1; margin-bottom:4px; }
  .pick.taken { background:#D9D7D0 !important; color:#9A988F; box-shadow:none; pointer-events:none; }
  .pick.taken .who { display:block; }
  .who { display:none; font-size:12px; font-weight:500; }
  .p-up { grid-column:2; grid-row:1; background:#FF6B6B; }
  .p-left { grid-column:1; grid-row:2; background:#7C6CF2; }
  .p-right { grid-column:3; grid-row:2; background:#FFB547; }
  .p-down { grid-column:2; grid-row:3; background:#2EC4B6; }
  .center { grid-column:2; grid-row:2; display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--muted); text-align:center; white-space:pre-line; }

  /* 조작 화면 */
  #pad { background:var(--c); color:#fff; touch-action:none; justify-content:space-between; }
  #pad .top { text-align:center; padding-top:env(safe-area-inset-top); }
  #pad .role { font-size:15px; opacity:.85; letter-spacing:.02em; }
  #pad .status { margin-top:6px; font-size:14px; background:rgba(0,0,0,.18); padding:6px 14px; border-radius:99px; display:inline-block; }
  #pad .mid { display:flex; flex-direction:column; align-items:center; gap:16px; pointer-events:none; }
  #bigArrow { font-size:min(46vw,260px,22vh); line-height:1; font-weight:800; transition:transform .12s ease-out; text-shadow:0 8px 0 rgba(0,0,0,.12); }
  #pad .guide { font-size:20px; font-weight:700; }
  #msg { font-size:15px; min-height:22px; opacity:.95; }
  #pad .bottom { padding-bottom:env(safe-area-inset-bottom); display:flex; flex-direction:column; align-items:center; gap:12px; width:100%; }
  #pokeRow { display:flex; align-items:center; gap:10px; }
  #pokeRow .lbl { font-size:13px; font-weight:700; opacity:.9; }
  .pk { width:52px; height:52px; border:0; border-radius:50%; background:#fff; font:inherit; font-size:26px; font-weight:900; line-height:1;
    box-shadow:0 4px 0 rgba(0,0,0,.15); display:flex; align-items:center; justify-content:center; }
  .pk:active { transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.15); }
  .pk.bot { opacity:.45; }
  .pk.hit { animation:shake .3s; }
  #poked { position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; gap:8px;
    background:rgba(255,255,255,.92); color:#2B2D42; font-size:30px; font-weight:900; text-align:center; z-index:20; pointer-events:none; }
  #poked.on { display:flex; animation:pokeIn .25s; }
  #poked small { font-size:16px; font-weight:700; color:#8A8C9E; }
  @keyframes pokeIn { 0%{transform:scale(1.15);opacity:0} 100%{transform:scale(1);opacity:1} }
  #modeSel { display:none; background:rgba(0,0,0,.2); border-radius:16px; padding:4px; gap:4px; width:min(80vw,320px); }
  #modeSel.on { display:flex; }
  #modeSel button { flex:1; border:0; background:transparent; color:#fff; font:inherit; font-size:16px; font-weight:800; padding:10px 0; border-radius:12px; }
  #modeSel button.sel { background:#fff; color:var(--c); box-shadow:0 3px 0 rgba(0,0,0,.15); }
  #modeHint { font-size:12px; opacity:.85; text-align:center; min-height:16px; }
  #startBtn { display:none; border:0; background:#fff; color:var(--c); font:inherit; font-size:20px; font-weight:800; padding:14px 0; width:min(80vw,320px);
    border-radius:18px; box-shadow:0 6px 0 rgba(0,0,0,.15); }
  #startBtn:active { transform:translateY(3px); box-shadow:0 3px 0 rgba(0,0,0,.15); }
  #startBtn small { display:block; font-size:12px; font-weight:600; color:#8A8C9E; margin-top:4px; }
  #startBtn.on { display:block; }
  #meter { position:relative; width:min(70vw,280px); height:14px; border-radius:99px; background:rgba(0,0,0,.2); overflow:hidden; }
  #meterFill { height:100%; width:0; background:rgba(255,255,255,.85); border-radius:99px; }
  #meterLine { position:absolute; top:-2px; bottom:-2px; width:3px; background:#fff; box-shadow:0 0 0 2px rgba(0,0,0,.25); }
  #motionBtn { display:none; border:0; background:rgba(255,255,255,.92); color:var(--c); font:inherit; font-size:16px; font-weight:800; padding:10px 18px; border-radius:99px; }
  #motionBtn.on { display:block; }
  #change { border:0; background:rgba(255,255,255,.2); color:#fff; font:inherit; font-size:13px; padding:8px 14px; border-radius:99px; }
  .shake { animation:shake .3s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-14px)} 40%{transform:translateX(12px)} 60%{transform:translateX(-8px)} 80%{transform:translateX(5px)} }

  /* 테마 선택 */
  #themeSel { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700; }
  #themeSel span { opacity:.85; margin-right:2px; }
  #themeSel button { border:0; background:rgba(0,0,0,.18); color:#fff; font:inherit; font-size:13px; font-weight:800; padding:7px 12px; border-radius:99px; }
  #themeSel button.sel { background:#fff; color:var(--c); }

  /* ---------- 네온 테마 ---------- */
  html[data-theme="neon"] { --bg:#020711; --ink:#EAF2FF; --muted:#8FA3C8; --cyan:#58D5F2; --violet:#A77BFF; }
  html[data-theme="neon"] body { background:radial-gradient(120% 70% at 50% -10%, #0B2342 0%, #06101F 55%, #020711 100%);
    font-family:"Chakra Petch","IBM Plex Sans KR","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  html[data-theme="neon"] #choose::before { content:"SCAN · PICK · MOVE"; display:block; font-size:11px; font-weight:700; letter-spacing:.3em; color:var(--cyan); margin-bottom:10px; }
  html[data-theme="neon"] .pick { background:linear-gradient(#141D40, #0B1330) !important; color:var(--pc); border:1.5px solid var(--pc);
    border-radius:0; clip-path:polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
    box-shadow:inset 0 0 18px color-mix(in srgb, var(--pc) 35%, transparent); text-shadow:0 0 10px var(--pc); }
  html[data-theme="neon"] .pick:active { transform:translateY(2px); }
  html[data-theme="neon"] .pick.taken { background:#0A0F22 !important; color:#4A5578; border-color:#2A3358; box-shadow:none; text-shadow:none; }
  html[data-theme="neon"] .p-up { --pc:#FF8FB7; } html[data-theme="neon"] .p-left { --pc:#A77BFF; }
  html[data-theme="neon"] .p-right { --pc:#F2B33A; } html[data-theme="neon"] .p-down { --pc:#4CF0C4; }
  html[data-theme="neon"] #pad { background:radial-gradient(90% 60% at 50% 45%, color-mix(in srgb, var(--c) 32%, #06101F) 0%, #020711 75%); color:#EAF2FF; }
  html[data-theme="neon"] #bigArrow { color:var(--c); text-shadow:0 0 18px var(--c), 0 0 42px var(--c); }
  html[data-theme="neon"] #pad .status { background:rgba(11,19,48,.85); border:1px solid var(--c); }
  html[data-theme="neon"] #pad .role { color:var(--c); letter-spacing:.12em; font-weight:700; }
  html[data-theme="neon"] #startBtn { background:linear-gradient(#141D40, #0B1330); color:#EAF2FF; border:1.5px solid var(--cyan); border-radius:0;
    clip-path:polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); box-shadow:inset 0 0 16px rgba(88,213,242,.3); }
  html[data-theme="neon"] #startBtn small { color:var(--muted); }
  html[data-theme="neon"] #modeSel, html[data-theme="neon"] #themeSel button { background:rgba(11,19,48,.85); }
  html[data-theme="neon"] #modeSel { border:1px solid rgba(127,140,255,.4); border-radius:4px; }
  html[data-theme="neon"] #modeSel button { border-radius:2px; }
  html[data-theme="neon"] #modeSel button.sel, html[data-theme="neon"] #themeSel button.sel { background:var(--c); color:#020711; box-shadow:0 0 12px var(--c); }
  html[data-theme="neon"] #themeSel button { border:1px solid rgba(127,140,255,.4); }
  html[data-theme="neon"] .pk { background:#0B1330; border:1.5px solid currentColor; box-shadow:0 0 10px currentColor; }
  html[data-theme="neon"] #motionBtn { background:#0B1330; color:#EAF2FF; border:1.5px solid var(--c); }
  html[data-theme="neon"] #change { background:rgba(11,19,48,.85); border:1px solid rgba(127,140,255,.4); }
  html[data-theme="neon"] #meter { background:rgba(11,19,48,.9); border:1px solid rgba(127,140,255,.35); }
  html[data-theme="neon"] #meterFill { background:var(--c); box-shadow:0 0 10px var(--c); }
  html[data-theme="neon"] #poked { background:rgba(2,7,17,.94); color:#EAF2FF; }
  html[data-theme="neon"] #offline { background:#0B1330; border:1px solid #FF6B7A; }

  /* ---------- 청사초롱 테마 (별 밤바다 + 옻칠 + 샴페인 골드 자개) ---------- */
  html[data-theme="cheong"] { --bg:#0A0E2A; --ink:#FFF1D2; --muted:#CDB892; --gold:#E2BC7C; }
  html[data-theme="cheong"] body { background:#0A0E2A url(themes/cheong/bg.jpg) center/cover no-repeat;
    font-family:"Gowun Batang","IBM Plex Sans KR","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",serif; }
  html[data-theme="cheong"] body::after { content:""; position:fixed; inset:8px; border:1.5px solid var(--gold); border-radius:10px; pointer-events:none;
    box-shadow:0 0 0 8px #0B0A10, 0 0 12px rgba(240,200,130,.4), inset 0 0 12px rgba(240,200,130,.18); z-index:30; }
  html[data-theme="cheong"] #choose { background:rgba(6,8,24,.35); }
  html[data-theme="cheong"] #choose::before { content:"수궁야행 · 청사초롱"; display:block; font-size:13px; letter-spacing:.3em; color:var(--gold); margin-bottom:10px; }
  html[data-theme="cheong"] #choose h1 { color:#FFF1D2; text-shadow:0 0 14px rgba(240,200,130,.45); }
  html[data-theme="cheong"] .pick { background:linear-gradient(#17151F, #07070B) !important; color:var(--pc); border:1.5px solid var(--gold); border-radius:12px;
    box-shadow:0 0 14px color-mix(in srgb, var(--pc) 40%, transparent), inset 0 0 22px color-mix(in srgb, var(--pc) 30%, transparent); text-shadow:0 0 10px var(--pc); }
  html[data-theme="cheong"] .pick:active { transform:translateY(2px); }
  html[data-theme="cheong"] .ar, html[data-theme="cheong"] #bigArrow, html[data-theme="cheong"] .pk { font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; font-weight:900; }
  html[data-theme="cheong"] .pick.taken { background:#0B0A10 !important; color:#5A5246; border-color:#3A3328; box-shadow:none; text-shadow:none; }
  html[data-theme="cheong"] .p-up { --pc:#FF6A5C; } html[data-theme="cheong"] .p-left { --pc:#F27AA8; }
  html[data-theme="cheong"] .p-right { --pc:#F7C843; } html[data-theme="cheong"] .p-down { --pc:#5FB0F2; }
  html[data-theme="cheong"] #pad { background:radial-gradient(80% 50% at 50% 42%, color-mix(in srgb, var(--c) 38%, transparent) 0%, rgba(6,8,24,.55) 70%); color:#FFF1D2; }
  html[data-theme="cheong"] #bigArrow { color:var(--c); text-shadow:0 0 22px var(--c), 0 0 50px color-mix(in srgb, var(--c) 60%, transparent); }
  html[data-theme="cheong"] #pad .status { background:rgba(7,7,11,.85); border:1px solid var(--gold); }
  html[data-theme="cheong"] #pad .role { color:#F3D6B8; letter-spacing:.12em; font-weight:700; }
  html[data-theme="cheong"] #startBtn { background:linear-gradient(#17151F, #07070B); color:#FFF1D2; border:1.5px solid var(--gold); border-radius:12px;
    box-shadow:0 0 14px rgba(240,200,130,.35), inset 0 0 0 4px #07070B, inset 0 0 0 5px rgba(226,188,124,.5); }
  html[data-theme="cheong"] #startBtn small { color:var(--muted); }
  html[data-theme="cheong"] #modeSel, html[data-theme="cheong"] #themeSel button, html[data-theme="cheong"] #change { background:rgba(7,7,11,.85); border:1px solid rgba(226,188,124,.5); }
  html[data-theme="cheong"] #modeSel button.sel, html[data-theme="cheong"] #themeSel button.sel { background:var(--gold); color:#1A1206; }
  html[data-theme="cheong"] .pk { background:#0B0A10; border:1.5px solid currentColor; box-shadow:0 0 10px currentColor; }
  html[data-theme="cheong"] #motionBtn { background:#0B0A10; color:#FFF1D2; border:1.5px solid var(--gold); }
  html[data-theme="cheong"] #meter { background:rgba(7,7,11,.9); border:1px solid rgba(226,188,124,.45); }
  html[data-theme="cheong"] #meterFill { background:var(--c); box-shadow:0 0 10px var(--c); }
  html[data-theme="cheong"] #poked { background:rgba(7,7,11,.94); color:#FFF1D2; }
  html[data-theme="cheong"] #offline { background:#0B0A10; border:1px solid #FF7A6B; }

  #offline { position:fixed; left:12px; right:12px; top:12px; background:#2B2D42; color:#fff; padding:10px 14px; border-radius:12px;
    font-size:14px; text-align:center; display:none; z-index:10; }
</style>
</head>
<body>
<div id="poked"></div>
<div id="offline">게임 화면과 연결 중… 같은 Wi-Fi인지 확인해 주세요</div>

<section id="choose" class="screen on">
  <h1>어느 방향을 맡을까요?</h1>
  <p>캐릭터를 그 방향으로만 움직일 수 있어요</p>
  <div class="cross">
    <button class="pick p-up" data-dir="up"><span class="ar">↑</span>위<span class="who">사용 중</span></button>
    <button class="pick p-left" data-dir="left"><span class="ar">←</span>왼쪽<span class="who">사용 중</span></button>
    <div class="center" id="freeCount"></div>
    <button class="pick p-right" data-dir="right"><span class="ar">→</span>오른쪽<span class="who">사용 중</span></button>
    <button class="pick p-down" data-dir="down"><span class="ar">↓</span>아래<span class="who">사용 중</span></button>
  </div>
</section>

<section id="pad" class="screen">
  <div class="top">
    <div class="role" id="role"></div>
    <div class="status" id="status">친구들을 기다리는 중</div>
  </div>
  <div class="mid">
    <div id="bigArrow">↑</div>
    <div class="guide" id="guide"></div>
    <div id="msg"></div>
    <div id="meter"><div id="meterFill"></div><div id="meterLine"></div></div>
  </div>
  <div class="bottom">
    <div id="pokeRow"><span class="lbl">콕 찌르기</span></div>
    <button id="motionBtn">📳 흔들기 켜기</button>
    <div id="modeSel"><button data-mode="normal">일반전</button><button data-mode="item">🎁 아이템전</button></div>
    <div id="modeHint"></div>
    <div id="themeSel"><span>테마</span><button data-theme="classic">크림</button><button data-theme="neon">네온</button><button data-theme="cheong">청사초롱</button></div>
    <button id="startBtn">지금 시작<small id="startSub"></small></button>
    <button id="change">방향 바꾸기</button>
  </div>
</section>

<script>
const INFO = {
  up:    { label:'위', to:'위로', arrow:'↑', color:'#FF6B6B', dx:0,  dy:-1 },
  right: { label:'오른쪽', to:'오른쪽으로', arrow:'→', color:'#FFB547', dx:1,  dy:0 },
  down:  { label:'아래', to:'아래로', arrow:'↓', color:'#2EC4B6', dx:0,  dy:1 },
  left:  { label:'왼쪽', to:'왼쪽으로', arrow:'←', color:'#7C6CF2', dx:-1, dy:0 },
};
const PHASE_TEXT = {
  lobby: '친구들을 기다리는 중 (4명이면 자동 시작)',
  countdown: '곧 시작해요!',
  play: '게임 중! 화면을 보며 협동하세요',
  clear: '스테이지 클리어!',
  result: '탈출 성공! 🎉',
};

let pid = null;
try { pid = localStorage.getItem('maze-pid'); } catch (e) {}
if (!pid) {
  pid = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  try { localStorage.setItem('maze-pid', pid); } catch (e) {}
}

let myDir = null;
let slots = { up:null, right:null, down:null, left:null };
let phase = 'lobby';
let mode = 'normal'; // 'normal' 일반전 | 'item' 아이템전
let theme = 'classic'; // 'classic' 크림 | 'neon' 네온 | 'cheong' 청사초롱 — 게임 화면·다른 폰과 함께 바뀜
const THEME_COLOR = {
  neon:   { up:'#FF8FB7', right:'#F2B33A', down:'#4CF0C4', left:'#A77BFF' },
  cheong: { up:'#FF6A5C', right:'#F7C843', down:'#5FB0F2', left:'#F27AA8' }, // 초롱 빛깔
};
const THEME_BAR = { classic:'#2B2D42', neon:'#020711', cheong:'#0A0E2A' };
const dirColor = d => (THEME_COLOR[theme] || {})[d] || INFO[d].color;
function applyTheme(t) {
  theme = THEME_BAR[t] ? t : 'classic';
  document.documentElement.dataset.theme = theme;
  if (myDir) renderPad();
  else document.querySelector('meta[name=theme-color]').content = THEME_BAR[theme];
}

const $ = id => document.getElementById(id);

function post(path, body) {
  return fetch(path, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(body), keepalive:true })
    .then(r => r.json().catch(() => ({}))).catch(() => ({ ok:false, net:true }));
}

function show(id) {
  for (const s of document.querySelectorAll('.screen')) s.classList.toggle('on', s.id === id);
}

function renderChoose() {
  let free = 0;
  for (const b of document.querySelectorAll('.pick')) {
    const d = b.dataset.dir;
    const taken = slots[d] && slots[d] !== pid;
    b.classList.toggle('taken', !!taken);
    if (!taken) free++;
  }
  $('freeCount').textContent = free ? `남은 자리\n${free}개` : '자리가\n꽉 찼어요';
}

function renderPad() {
  const i = INFO[myDir];
  document.documentElement.style.setProperty('--c', dirColor(myDir));
  document.querySelector('meta[name=theme-color]').content = theme === 'classic' ? i.color : THEME_BAR[theme];
  for (const b of $('themeSel').querySelectorAll('button')) b.classList.toggle('sel', b.dataset.theme === theme);
  $('role').textContent = `나는 ${i.label} 담당`;
  $('bigArrow').textContent = i.arrow;
  $('guide').textContent = motionSeen ? '폰을 흔들면 한 칸 이동!' : `화면을 ${i.to} 쓱 밀어요`;
  $('motionBtn').classList.toggle('on', !motionSeen);
  $('status').textContent = PHASE_TEXT[phase] || '';
  // 대기 중이고 4명이 다 안 모였으면 '지금 시작' 버튼 표시
  const joined = Object.values(slots).filter(Boolean).length;
  const canStart = (phase === 'lobby' && joined < 4) || phase === 'result';
  $('startBtn').classList.toggle('on', canStart);
  $('startBtn').firstChild.textContent = phase === 'result' ? '다시 도전' : '지금 시작';
  renderPoke();
  $('startSub').textContent = joined < 4 ? `빈 자리 ${4 - joined}개는 🤖 도우미가 맡아요` : '';
  // 모드 선택: 대기·결과 화면에서만
  const canMode = phase === 'lobby' || phase === 'result';
  $('modeSel').classList.toggle('on', canMode);
  for (const b of $('modeSel').children) b.classList.toggle('sel', b.dataset.mode === mode);
  $('modeHint').textContent = canMode
    ? (mode === 'item' ? '⭐ 기록 -4초 · ⏳ 타이머 2초 정지 · 🚀 5칸 질주' : '')
    : (mode === 'item' ? '🎁 아이템전 진행 중' : '');
}

for (const b of $('modeSel').children) {
  b.addEventListener('click', async () => {
    if (b.dataset.mode === mode) return;
    buzz(15);
    mode = b.dataset.mode; renderPad(); // 바로 반영, 서버 응답으로 확정
    const r = await post('/mode', { pid, mode: b.dataset.mode });
    if (r.mode) { mode = r.mode; renderPad(); }
  });
}

for (const b of $('themeSel').querySelectorAll('button')) {
  b.addEventListener('click', async () => {
    if (b.dataset.theme === theme) return;
    buzz(15);
    applyTheme(b.dataset.theme); // 바로 반영, 서버 응답으로 확정
    const r = await post('/theme', { pid, theme: b.dataset.theme });
    if (r.theme) applyTheme(r.theme);
  });
}

// ---------- 콕 찌르기: 다른 방향 담당에게 "네 차례야!" ----------
function renderPoke() {
  const row = $('pokeRow');
  const others = ['up', 'right', 'down', 'left'].filter(d => d !== myDir);
  const sig = theme + others.map(d => d + (slots[d] ? 1 : 0)).join();
  if (row.dataset.sig === sig) return;
  row.dataset.sig = sig;
  row.querySelectorAll('.pk').forEach(b => b.remove());
  for (const d of others) {
    const b = document.createElement('button');
    b.className = 'pk' + (slots[d] ? '' : ' bot');
    b.textContent = INFO[d].arrow; b.style.color = dirColor(d);
    b.addEventListener('click', async () => {
      buzz(15);
      b.classList.remove('hit'); void b.offsetWidth; b.classList.add('hit');
      const r = await post('/poke', { pid, to: d });
      if (r.ok) setMsg(r.bot ? `🤖 ${INFO[d].label} 도우미는 알아서 움직여요` : `${INFO[d].arrow} ${INFO[d].label} 담당을 콕! 찔렀어요`);
    });
    row.appendChild(b);
  }
}
let pokedTimer = null;
function showPoked(from) {
  const i = INFO[from];
  if (!i) return;
  buzz([120, 80, 120, 80, 160]);
  const el = $('poked');
  el.innerHTML = `<div style="font-size:64px;color:${dirColor(from)}">${i.arrow}</div>콕! 네 차례야!<small>${i.label} 담당이 찔렀어요</small>`;
  el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
  clearTimeout(pokedTimer);
  pokedTimer = setTimeout(() => el.classList.remove('on'), 1600);
}

$('startBtn').addEventListener('click', async () => {
  buzz(30);
  const r = await post('/start', { pid });
  if (r.reason === 'noslot') setMine(null);
});

function setMine(dir) {
  myDir = dir;
  if (dir) { renderPad(); show('pad'); }
  else { renderChoose(); show('choose'); }
}

for (const b of document.querySelectorAll('.pick')) {
  b.addEventListener('click', async () => {
    enableMotion(); // iPhone은 버튼을 누른 그 순간에 센서 권한을 물어야 해서 맨 먼저 호출
    const r = await post('/join', { pid, dir: b.dataset.dir });
    if (r.ok) { buzz(20); setMine(r.dir); }
    else if (r.reason === 'taken') { b.classList.add('shake'); setTimeout(() => b.classList.remove('shake'), 300); }
  });
}

$('change').addEventListener('click', async () => {
  await post('/leave', { pid });
  setMine(null);
});

// ---------- 드래그 판정 (폰에서 직접) ----------
let start = null, fired = false;
const pad = $('pad');
const threshold = () => Math.max(28, Math.min(innerWidth, innerHeight) * 0.08);

pad.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  start = { x: e.clientX, y: e.clientY };
  fired = false;
  try { pad.setPointerCapture(e.pointerId); } catch (err) {}
});
pad.addEventListener('pointermove', e => {
  if (!start || fired) return;
  const dx = e.clientX - start.x, dy = e.clientY - start.y;
  if (Math.hypot(dx, dy) < threshold()) return;
  fired = true;
  const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  onSwipe(dir);
});
const end = () => { start = null; };
pad.addEventListener('pointerup', end);
pad.addEventListener('pointercancel', end);
document.addEventListener('touchmove', e => e.preventDefault(), { passive:false });
document.addEventListener('gesturestart', e => e.preventDefault());

// ---------- 흔들기 판정 (방향 상관없이 흔들면 내 방향으로 1칸) ----------
// 세게 흔들면 1칸. 다음 흔들기는 '세기가 절반 아래로 떨어지거나' '일정 시간이 지나면' 다시 받음
// (예전엔 거의 멈춰야 재장전돼서, 계속 흔드는 동안엔 인식이 끊기는 문제가 있었음)
const SHAKE_FORCE = 18;     // m/s² — 이보다 세게 흔들어야 1칸 (걷기·손떨림은 보통 3~5, 가볍게 흔들기 10 안팎)
const SHAKE_REARM = 9;      // m/s² — 이 아래로 내려오면 다음 흔들기 준비
const SHAKE_REARM_MS = 450; // ms — 세기가 안 내려와도 이 시간이 지나면 다음 흔들기 준비
const SHAKE_MIN_GAP = 280;  // ms — 한 번 흔들기의 왕복이 두 칸이 되지 않게
let motionOn = false, motionSeen = false, lastShake = 0, armed = true;
let gx = 0, gy = 0, gz = 0, gInit = false;

async function enableMotion() {
  if (typeof DeviceMotionEvent === 'undefined') return false;
  if (typeof DeviceMotionEvent.requestPermission === 'function') { // iOS 13+
    try { if (await DeviceMotionEvent.requestPermission() !== 'granted') { setMsg('센서가 꺼져 있어요. 화면을 밀어서 움직여요'); return false; } }
    catch (e) { return false; }
  }
  if (!motionOn) { addEventListener('devicemotion', onMotion); motionOn = true; }
  return true;
}

function onMotion(e) {
  let x, y, z;
  const a = e.acceleration;
  if (a && a.x != null) { x = a.x; y = a.y; z = a.z; }
  else {
    // 중력 제외 값이 없는 폰: 중력 성분을 천천히 따라가며 빼기
    const g = e.accelerationIncludingGravity;
    if (!g || g.x == null) return;
    if (!gInit) { gx = g.x; gy = g.y; gz = g.z; gInit = true; }
    gx = gx * 0.9 + g.x * 0.1; gy = gy * 0.9 + g.y * 0.1; gz = gz * 0.9 + g.z * 0.1;
    x = g.x - gx; y = g.y - gy; z = g.z - gz;
  }
  if (!motionSeen) { motionSeen = true; if (myDir) renderPad(); }
  if (!myDir) return;
  const now = performance.now();
  const m = Math.hypot(x, y, z);
  meterPeak = Math.max(meterPeak, m);
  if (!armed && ((m < SHAKE_REARM && now - lastShake > 120) || now - lastShake > SHAKE_REARM_MS)) armed = true;
  if (armed && m > SHAKE_FORCE && now - lastShake > SHAKE_MIN_GAP) {
    armed = false;
    lastShake = now;
    onSwipe(myDir);
    flash();
  }
}

// 흔들기 세기 막대: 흰 선(기준)을 넘기면 1칸
let meterPeak = 0;
(function meterLoop() {
  const fill = $('meterFill');
  if (fill) fill.style.width = Math.min(100, meterPeak / (SHAKE_FORCE * 1.6) * 100) + '%';
  meterPeak *= 0.88;
  requestAnimationFrame(meterLoop);
})();
$('meterLine').style.left = (100 / 1.6) + '%';

// 흔들 때마다 화면이 번쩍 — 인식됐다는 걸 바로 느끼게
function flash() {
  pad.style.transition = 'none'; pad.style.filter = 'brightness(1.35)';
  requestAnimationFrame(() => { pad.style.transition = 'filter .18s'; pad.style.filter = ''; });
}

$('motionBtn').addEventListener('click', () => { enableMotion(); });
enableMotion(); // 안드로이드는 권한 없이 바로 켜짐

let msgTimer = null;
function onSwipe(dir) {
  if (!myDir) return;
  post('/swipe', { pid, dir }).then(r => { if (r.reason === 'noslot') setMine(null); });
  const a = $('bigArrow');
  if (dir === myDir) {
    const i = INFO[myDir];
    a.style.transform = `translate(${i.dx * 30}px, ${i.dy * 30}px) scale(1.08)`;
    setTimeout(() => { a.style.transform = ''; }, 120);
    buzz(25);
    setMsg('');
  } else {
    a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake');
    buzz([30, 40, 30]);
    setMsg(`나는 ${INFO[myDir].arrow} ${INFO[myDir].to}만 움직일 수 있어요`);
  }
}
function setMsg(t) {
  $('msg').textContent = t;
  clearTimeout(msgTimer);
  if (t) msgTimer = setTimeout(() => { $('msg').textContent = ''; }, 1800);
}
function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

// ---------- 서버 상태 받기 ----------
// 인터넷 터널(Cloudflare)은 실시간 스트림(SSE)을 버퍼링해서 폰에 늦게 도착함.
// 그래서 폰은 1초마다 /ping 으로 상태(자리·게임 단계)를 받아옴. 같은 Wi-Fi에서도 똑같이 동작.
// (드래그는 별도 요청으로 즉시 전송되므로 반응 속도와는 무관)
let fails = 0;
function applyState(r) {
  slots = r.slots || slots;
  phase = r.phase || phase;
  mode = r.mode || mode;
  if (r.theme && r.theme !== theme) applyTheme(r.theme);
  if (r.poke && r.poke.from) showPoked(r.poke.from);
  const mine = r.dir || null;
  if (mine !== myDir) setMine(mine);
  else if (myDir) renderPad();
  else renderChoose();
}
async function poll() {
  const r = await post('/ping', { pid });
  if (r.ok) {
    fails = 0;
    $('offline').style.display = 'none';
    applyState(r);
  } else if (++fails >= 2) {
    $('offline').style.display = 'block';
  }
  setTimeout(poll, 1000);
}
poll();
</script>
</body>
</html>
